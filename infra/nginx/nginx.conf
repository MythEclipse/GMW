# Run as the service user; the master and worker both run as gmw so no
# privilege-drop is needed.
user gmw;

# The service runs as a non-root user that cannot write /run, so the pid file
# lives in the state directory the unit already owns.
pid /var/lib/gmw-proxy/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;

  access_log /var/lib/gmw-proxy/nginx-access.log;
  error_log /var/lib/gmw-proxy/nginx-error.log;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

# Vite SPA static server (serve.mjs serves dist/ + SPA fallback).
  upstream gmw_next {
    server 127.0.0.1:4017;
    keepalive 16;
  }

  upstream gmw_backend {
    server 127.0.0.1:4001;
    keepalive 16;
  }

  server {
    listen 4009;
    server_name _;

    # Use relative redirects (Location: /dashboard/) instead of absolute
    # URLs that leak the internal listen port (4009) through the reverse proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 256;

    # ── Backend REST ───────────────────────────────────────────────
    location ^~ /api {
      proxy_pass http://gmw_backend$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";   # keepalive to backend
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Backend WebSocket (realtime shared state + voice PCM) ──────
    location ^~ /ws {
      proxy_pass http://gmw_backend$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade              $http_upgrade;
      proxy_set_header Connection           $connection_upgrade;
      proxy_set_header Host                 $host;
      proxy_set_header X-Real-IP            $remote_addr;
      proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto    $scheme;
      proxy_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ── Backend oRPC (structured data RPCs over WebSocket)
    #     Browser reaches this via partysocket (wss://…/trpc): oRPC's
    #     ORPCWebSocketServer on :4001. No server-side fetcher remains. ──
    location ^~ /trpc {
      proxy_pass http://gmw_backend$uri$is_args$args;
      proxy_http_version 1.1;
      # Upgrade headers required for the WebSocket transport; harmless for POST.
      proxy_set_header Upgrade              $http_upgrade;
      proxy_set_header Connection           $connection_upgrade;
      proxy_set_header Host                 $host;
      proxy_set_header X-Real-IP            $remote_addr;
      proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto    $scheme;
      proxy_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ── Vite build assets — immutable, edge/shareable ──────────────
    location ^~ /assets/ {
      proxy_pass http://gmw_next$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ── Everything else → SPA shell (index.html via serve.mjs) ──
    location / {
      proxy_pass http://gmw_next$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 30s;
    }
  }
}
