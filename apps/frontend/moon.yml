$schema: 'https://moonrepo.dev/schemas/project.json'

# Per-project file group — see the identical block in apps/backend/moon.yml for
# why this moved out of .moon/tasks.yml in the moon 2.x fix.
#
# frontend additionally excludes routeTree.gen.ts: it is generated from
# src/routes and gitignored, so it is an OUTPUT of `routegen`, never an input.
fileGroups:
  ts:
    - '**/*.ts'
    - '**/*.tsx'
    - '!dist/**'
    - '!node_modules/**'
    - '!src/routeTree.gen.ts'

tasks:
  # ── shared tasks, defined per project in moon 2.x ──────────────────────────
  # Duplicated from apps/backend/moon.yml; see .moon/tasks.yml for why root
  # inheritance does not work in 2.6.0.
  #
  # Two lint tasks on purpose. `lint` is biome at its DEFAULT severity (the
  # backend runs `--diagnostic-level=error`); `lint-design` is oxlint running
  # @shadcn/lint, which keeps Tailwind classes on the shadcn theme instead of
  # raw colors. Frontend-only — folding it into the backend task would make the
  # backend depend on a tool it does not have.
  lint:
    inputs:
      - '@globs(ts)'
      - 'biome.json'
    command: 'biome check .'

  lint-design:
    inputs:
      - '@globs(ts)'
      - '.oxlintrc.json'
    command: 'oxlint'
    options:
      cache: false

  format:
    inputs:
      - '@globs(ts)'
      - 'biome.json'
    command: 'biome format --write .'
    options:
      cache: false

  dev:
    command: 'vite'
    # `preset: 'server'`, not `local: true` + `persistent: true`. Both were
    # moon 1.x fields rejected outright by 2.x — see apps/backend/moon.yml for
    # the full rationale and the 2.0 rename.
    preset: 'server'

  # `routeTree.gen.ts` is generated from src/routes and is gitignored, so every
  # task that compiles or bundles MUST depend on this. Without the edge a clean
  # CI checkout typechecks against a missing route tree and fails — which is the
  # whole reason the file is generated rather than committed.
  routegen:
    inputs:
      - 'src/routes/**'
      - 'vite.config.ts'
    outputs:
      - 'src/routeTree.gen.ts'
    command: 'vite build --mode routegen'
    # Not a server — a one-shot codegen. Only the "don't cache" half of the old
    # `local: true` applies; see apps/backend/moon.yml test-integration.
    options:
      cache: false

  # Frontend `typecheck` depends on `backend:build`.
  #
  # P4 makes the frontend import `AppRouterClient` as a TYPE from the backend,
  # so its typecheck consumes `apps/backend/dist/*.d.ts`. Expressing that as a
  # task edge is the point of moving to a task graph: nobody has to remember to
  # build the backend first, and CI cannot typecheck a missing declaration tree.
  typecheck:
    command: 'tsc --noEmit'
    deps:
      - 'backend:build'
      - 'routegen'

  build:
    inputs:
      - '@globs(ts)'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
    outputs:
      - 'dist'
    script: 'tsc --noEmit && vite build'
    deps:
      - 'backend:build'
      - 'routegen'

  # kana §9: each project declares dev/build/test. Root `package.json` already
  # routes `test` to `moon run :test`, which aggregates this with backend:test.
  #
  # No `@globs(tests)` here — unlike the backend, this project's fileGroups
  # only defines `ts`, and adding an unused group would be a lie about what the
  # task reads. Colocated `src/**/*.test.{ts,tsx}` is covered by `@globs(ts)`.
  #
  # `vitest run` not `vitest`: one shot, no watch, so CI and `moon run :test`
  # terminate. A vacuous pass (zero tests) is currently the expected result —
  # the harness is wired up ahead of the tests themselves.
  test:
    inputs:
      - '@globs(ts)'
      - 'vitest.config.mts'
    command: 'vitest run'