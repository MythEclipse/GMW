$schema: 'https://moonrepo.dev/schemas/toolchain.json'

# bun: false.
#
# The repo moved off bun in P2, but two traces survive deliberately and are
# worth naming rather than discovering later:
#
#  * `deploy-direct.sh` still shells out to `bun install`. It runs ON the VPS
#    against an immutable release checkout, and switching it to pnpm is its own
#    change with its own rollback story — bundling it here would mean one commit
#    touching both the task graph and the deploy path.
#  * `apps/backend/bunfig.toml` is already deleted; its replacement is
#    `vitest.config.ts`'s setupFiles.
#
# pnpm is pinned to the version the Dockerfiles already used, so local and CI
# resolve identically.
bun: false
pnpm: '10.33.2'
node: '24.21.0'