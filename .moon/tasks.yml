$schema: 'https://moonrepo.dev/schemas/tasks.json'

# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE NO LONGER DEFINES TASKS. It is intentionally near-empty.
#
# The 1.x setup defined `typecheck`, `lint`, `format`, `test` here and had both
# projects inherit them. moon 2.x broke that: root-defined tasks are not
# inherited by projects unless a project explicitly opts in, and the opt-in
# paths all failed against 2.6.0 —
#
#   extends: '<same name>'   → stack overflow in the CLI (self-referential)
#   extends: 'global'        → "extending an unknown task global"
#   .moon/tasks/*.yml        → schema rejects the directory form
#   fileGroups at root       → project::unknown_file_group (2.x resolves a group
#                              against the referencing project, not the root)
#
# So each project now declares its own tasks, and the root `package.json`
# aggregates them by target (`:typecheck` still means "both projects"). The
# trade-off is duplication of ~4 task definitions between two moon.yml files;
# the cost of the alternative is a task graph that does not execute at all.
#
# WHAT IS STILL HERE: the two fileGroups. They are duplicated per project for
# the same resolution reason — a root group is invisible to `backend` and
# `frontend`.
# ─────────────────────────────────────────────────────────────────────────────

fileGroups:
  ts:
    - '**/*.ts'
    - '**/*.tsx'
    - '!**/dist/**'
    - '!**/node_modules/**'
    - '!**/routeTree.gen.ts'
  tests:
    - '**/*.test.ts'
    - 'tests/**'
    - 'tests-gateway/**'
    - '!**/node_modules/**'