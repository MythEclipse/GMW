name: CI

# Runs the same checks as deploy.yml's `test` job, on every PR and on pushes
# that are not to main.
#
# WHY THIS EXISTS: deploy.yml triggers on push-to-main and deploys straight to
# the VPS. Until this file existed there was NO PR-triggered CI at all, so a
# broken push to main was discovered by production rather than by a check.
# deploy.yml stays the deploy path; this is the gate in front of it.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # 11 of the 29 backend test files are real-Postgres integration tests and 10
    # of those TRUNCATE shared tables, so the suite needs a live database. The
    # port here is deliberately NOT 6432: tests/setup-env.ts points DATABASE_URL
    # at a dead port on purpose so a unit test that accidentally opens a pool
    # fails loudly. Only the files that explicitly want a pool opt in.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: gmw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gmw_test
      # A DB-backed test file that cannot build its isolated schema FAILS the run
      # rather than skipping. Without this, a missing schema silently skips every
      # assertion in those files and the suite still reports green — measured at
      # 21 files skipping against an empty database.
      #
      # These files need the schema applied to `gmw_test` before the test step,
      # which this workflow does NOT yet do. Until it does, expect the test job
      # to go red with `relation "public.messages" does not exist`; that is the
      # gate working, not a broken test. Applying the schema safely is blocked on
      # the missing drizzle baseline snapshot — see the Migration drift check.
      GMW_REQUIRE_TEST_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck + lint + test
        run: |
          moon run :typecheck
          moon run :lint
          moon run :test


      - name: Build
        run: moon run :build

      - name: Design lint (frontend only)
        run: moon run frontend:lint-design

      # Migration drift gate (skill §5).
      #
      # NOT yet a blocking gate, and `continue-on-error` is deliberate rather
      # than a shrug. This step currently exits 2 by design:
      # `drizzle/migrations/meta/0000_snapshot.json` does not exist, because the
      # baseline was captured with `pg_dump --schema-only` rather than generated
      # by drizzle-kit. Without that snapshot drizzle-kit cannot diff schema.ts
      # and emits a migration re-CREATing all 20 tables (verified 2026-10-05:
      # `0001_heavy_molly_hayes.sql`, 325 lines of CREATE TABLE). Synthesising the
      # snapshot from schema.ts is NOT safe yet — schema.ts declares 0 check()
      # constraints and 0 SQL functions, while the live baseline has 6 CHECKs and
      # 2 functions, one of which (`claim_messages`) is the worker's queue
      # primitive. A snapshot taken from schema.ts today would record those as
      # absent and the next real generate would DROP them.
      #
      # To make this blocking: port the 6 CHECK constraints and 2 functions into
      # schema.ts, regenerate the snapshot, then delete the `continue-on-error`
      # below. Until then this surfaces the blocker on every run instead of
      # pretending the rule is enforced.
      - name: Migration drift check
        run: moon run backend:db-check
        continue-on-error: true
