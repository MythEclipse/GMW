name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gmw-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  test:
    runs-on: ubuntu-latest

    # Eleven of the backend test files are real-Postgres integration tests and ten
    # of those TRUNCATE shared tables, so the suite needs a live database. Each
    # file takes its own schema via `tests-gateway/isolated-pool.ts`, so they no
    # longer wipe each other's rows — but they still need a database that HAS the
    # schema, or every one of them skips.
    #
    # Without this block the suite still went green: `TEST_DATABASE_URL` unset
    # meant every DB-backed file fell back to the hardcoded dev DSN, got
    # ECONNREFUSED, warned, and skipped its assertions. The one test that
    # touched Postgres directly had no such guard and failed the run instead, so
    # a missing database read as a flaky test rather than a missing service.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: gmw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gmw_test
      # A DB-backed test file that cannot build its isolated schema FAILS the run
      # rather than skipping. Without this, a missing schema silently skips every
      # assertion in those files and the suite still reports green — measured at
      # 21 files skipping against an empty database.
      GMW_REQUIRE_TEST_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Apply schema to the test database
        # `0000_baseline.sql` IS the schema of record: one migration, the whole
        # schema, verified to apply to an empty database (20 tables, 2 functions
        # including `claim_messages`, which the worker's queue depends on).
        #
        # `psql -f` rather than `pnpm db:migrate` on purpose. The drizzle
        # migrator loads `src/infrastructure/config`, whose zod schema validates
        # DISCORD_TOKEN / AI_LLM_API_KEY and friends at import time — so running
        # it from CI means stubbing application config to create tables. This
        # step needs no application config and no build step, and the ledger it
        # would write (`__drizzle_migrations`) is read by no test in this suite.
        run: psql -v ON_ERROR_STOP=1 "$TEST_DATABASE_URL" -f apps/backend/drizzle/migrations/0000_baseline.sql

      - name: Install deps + test
        run: |
          pnpm install --frozen-lockfile
          # Vitest (migrated from `bun test` in P0). The include globs and the
          # setup-env preload both live in vitest.config.ts — the stale
          # src/e2e.test.ts that needed a live API_BASE has been deleted.
          pnpm --filter discord-moderation-backend run test


      - name: Typecheck + build frontend
        run: pnpm --filter frontend run build

      - name: Biome + design lint (frontend)
        run: |
          pnpm --filter frontend run lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via scripts/deploy-direct.sh
        # The heavy lifting lives in scripts/deploy-direct.sh, which runs ON
        # the VPS: it clones the commit, runs pnpm install,
        # tsc build per app, prunes devDeps, installs wrappers +
        # systemd units + nginx config, switches /opt/gmw/current, restarts,
        # and runs a stability-aware health check (systemctl + HTTP probes).
        #
        # The script is SCP'd from THIS checkout, not run from
        # /opt/gmw/current/scripts/. Running it from the active release would
        # be a chicken-and-egg trap: a fix to the deploy script could never
        # take effect, because the copy that would apply it is itself the
        # stale one. This step shipped that exact failure (exit 127, old
        # script without the bun PATH fix).
        #
        # NOTE: service env (DATABASE_URL, AI_LLM_API_KEY, …) comes from
        # the Bitwarden Secrets Manager backend via /usr/local/bin/bws-exec,
        # NOT from an EnvironmentFile — /etc/gmw/ is empty on the VPS.
        #
        # The runtime-data reset (Postgres `dcbot`) lives INSIDE the deploy script,
        # right before the
        # restart. It used to be its own CI step between build and restart;
        # moving it in there keeps the original invariant — the build must
        # fully succeed before any data is destroyed — without a separate
        # step that could be reordered or skipped. The old `if:
        # matrix.service == 'discord-gateway'` guard existed only because the
        # Nix pipeline ran a 4-leg matrix; this pipeline is one-legged.
        #
        # The Discord capture process and the moderation worker used to be
        # separate units checked here; both are now inside gmw-backend.
        #
        # RESET_RUNTIME_DATA=0 skips the wipe for an incident deploy.
        run: |
          echo "=== Deploying ${{ github.sha }} to $VPS_HOST ==="
          scp -q scripts/deploy-direct.sh "$VPS_USER@$VPS_HOST:/tmp/deploy-direct.sh"
          ssh "$VPS_USER@$VPS_HOST" \
            "sed -i 's/\r$//' /tmp/deploy-direct.sh && RESET_RUNTIME_DATA='${{ vars.RESET_RUNTIME_DATA || 1 }}' bash /tmp/deploy-direct.sh ${{ github.sha }}"
          echo "✅ deploy finished"

      - name: Verify services
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "for u in gmw-backend gmw-frontend gmw-proxy; do \
               state=\$(sudo systemctl is-active \$u 2>/dev/null || echo inactive); \
               echo \"  \$u -> \$state\"; \
             done; \
             echo '--- HTTP ---'; \
             for url in http://127.0.0.1:4001/api/health http://127.0.0.1:4017/ http://127.0.0.1:4009/ http://127.0.0.1:4009/api/health; do \
               code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \$url); \
               echo \"  \$url -> \$code\"; \
             done"
