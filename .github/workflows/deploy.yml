name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gmw-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Generate Prisma client
        working-directory: packages/db
        run: |
          bun install --frozen-lockfile
          bun run generate

      - name: Install deps + test (backend)
        working-directory: apps/backend
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/tsc --noEmit
          # src/e2e.test.ts requires a live backend (API_BASE) — unit tests
          # live in tests/ and are excluded by the bun test dir.
          bun test tests/

      - name: Install deps + test (discord-gateway)
        working-directory: apps/discord-gateway
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/tsc --noEmit
          bun test tests/

      - name: Biome check (all apps)
        run: |
          cd apps/backend && ./node_modules/.bin/biome check src/ tests/
          cd ../discord-gateway && ./node_modules/.bin/biome check src/

      - name: Install deps + typecheck + build (frontend)
        working-directory: apps/frontend
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build

      - name: Biome + design lint (frontend)
        working-directory: apps/frontend
        run: |
          ./node_modules/.bin/biome check .
          # @shadcn/lint via oxlint: keeps the Tailwind classes on the
          # shadcn theme instead of raw colors and arbitrary values.
          ./node_modules/.bin/oxlint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via scripts/deploy-direct.sh
        # The heavy lifting lives in scripts/deploy-direct.sh on the VPS:
        # clone the commit, bun install, prisma generate + compile, tsc build
        # for each app, prune devDeps, install wrappers + systemd units +
        # nginx config, switch the /opt/gmw/current symlink, restart, and
        # run a stability-aware health check (systemctl + HTTP probes).
        #
        # NOTE: service env (DATABASE_URL, AI_MEMORY_BASE_URL, …) comes from
        # the Bitwarden Secrets Manager backend via /usr/local/bin/bws-exec,
        # NOT from an EnvironmentFile — /etc/gmw/ is empty on the VPS.
        run: |
          echo "=== Deploying main to $VPS_HOST ==="
          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/gmw/current/scripts/deploy-direct.sh main"
          echo "✅ deploy finished"

      - name: Verify services
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "for u in gmw-backend gmw-discord-gateway gmw-discord-gateway-worker gmw-frontend gmw-proxy; do \
               state=\$(sudo systemctl is-active \$u 2>/dev/null || echo inactive); \
               echo \"  \$u -> \$state\"; \
             done; \
             echo '--- HTTP ---'; \
             for url in http://127.0.0.1:4001/api/health http://127.0.0.1:4017/ http://127.0.0.1:4009/ http://127.0.0.1:4009/api/health; do \
               code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \$url); \
               echo \"  \$url -> \$code\"; \
             done"
